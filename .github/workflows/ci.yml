name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --cov=lammps_agent --cov-report=term-missing --cov-fail-under=85
      - run: python -m compileall -q src tests
      - run: python -m ruff check src tests
      - run: python -m mypy src/lammps_agent
      - run: git diff --check

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv /tmp/iamlammps-wheel
          /tmp/iamlammps-wheel/bin/pip install dist/*.whl
          python -m venv /tmp/iamlammps-sdist
          /tmp/iamlammps-sdist/bin/pip install dist/*.tar.gz
      - name: Verify installed CLI and package resources
        run: |
          mkdir /tmp/iamlammps-project
          /tmp/iamlammps-wheel/bin/iamlammps --help
          /tmp/iamlammps-wheel/bin/iamlammps init /tmp/iamlammps-project
          test -f /tmp/iamlammps-project/.env.example
          test -f /tmp/iamlammps-project/.iamlammps/mcp.example.json
          test -f /tmp/iamlammps-project/runs/spce-100/inputs/spce.in
          test -f /tmp/iamlammps-project/runs/spce-100/reference/rdf_oo.csv
          cd /tmp/iamlammps-project
          printf '/exit\n' | env OPENAI_API_KEY=test OPENAI_MODEL=gpt-5-mini \
            OPENAI_TRACING=false /tmp/iamlammps-wheel/bin/iamlammps --interactive
          mkdir /tmp/iamlammps-sdist-project
          /tmp/iamlammps-sdist/bin/iamlammps init /tmp/iamlammps-sdist-project
          test -f /tmp/iamlammps-sdist-project/runs/spce-100/inputs/spce.mol

  linux-lammps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned LAMMPS and project
        run: |
          python -m pip install 'lammps==2025.7.22.2.0' -e '.[test]'
      - name: Run required SPC/E integration without skips
        env:
          LAMMPS_COMMAND: lmp
          IAMLAMMPS_REQUIRE_INTEGRATION: "1"
        run: python -m pytest -m integration -q

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_lammps_runner.py tests/test_main_cli.py -q
