[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iamlammps"
version = "5.0.0"
description = "OpenAI Agents SDK powered LAMMPS simulation agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "JinZongxiao" }]
keywords = ["lammps", "molecular-dynamics", "simulation", "agent", "openai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "httpx>=0.28.0,<1",
  "matplotlib>=3.7,<4",
  "numpy>=1.21.0",
  "openai>=2.45.0,<3",
  "openai-agents>=0.18.2,<1",
  "pydantic>=2.12.2,<3",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=7.0.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
iamlammps = "lammps_agent.main:main"

[project.urls]
Homepage = "https://github.com/JinZongxiao/IamLammps"
Repository = "https://github.com/JinZongxiao/IamLammps.git"
Issues = "https://github.com/JinZongxiao/IamLammps/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lammps_agent*"]

[tool.setuptools.package-data]
lammps_agent = [
  "resources/project/.env.example",
  "resources/project/.iamlammps/*.json",
  "resources/project/.iamlammps/skills/*/*.md",
  "resources/project/runs/*/inputs/*",
  "resources/project/runs/*/reference/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a local LAMMPS installation and potential files"]

[tool.coverage.run]
branch = true
source = ["lammps_agent"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
